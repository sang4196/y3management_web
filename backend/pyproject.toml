[project]
name = "y3management-backend"
version = "0.1.0"
description = "PT management backend foundation"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.15,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3",
]

[dependency-groups]
dev = [
  "ruff>=0.11,<1",
  "mypy>=1.15,<3",
  "pytest>=8.3,<10",
  "httpx>=0.28,<1",
  "import-linter>=2.3,<3",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/y3management"]

[tool.uv]
prerelease = "disallow"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.13"
strict = true
files = ["src", "tests", "alembic/env.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["postgres: requires explicit dedicated local PostgreSQL test database"]

[tool.importlinter]
root_package = "y3management"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Foundation dependency direction"
type = "layers"
containers = ["y3management"]
layers = ["main", "application", "database", "config"]
exhaustive = true

[[tool.importlinter.contracts]]
name = "Infrastructure does not depend on HTTP framework"
type = "forbidden"
source_modules = ["y3management.config", "y3management.database"]
forbidden_modules = ["fastapi", "starlette"]
