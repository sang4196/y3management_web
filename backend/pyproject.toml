[project]
name = "y3management-backend"
version = "0.1.0"
description = "PT management backend foundation"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.15,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3",
  "pwdlib==0.3.1",
  "argon2-cffi==25.1.0",
  "argon2-cffi-bindings==26.1.0",
  "cffi==2.1.1",
  "pycparser==3.0",
  "webauthn==3.0.1",
]

[dependency-groups]
dev = [
  "ruff>=0.11,<1",
  "mypy>=1.15,<3",
  "pytest>=8.3,<10",
  "httpx>=0.28,<1",
  "import-linter>=2.3,<3",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/y3management"]

[tool.uv]
prerelease = "disallow"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.13"
strict = true
files = ["src", "tests", "alembic/env.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["postgres: requires explicit dedicated local PostgreSQL test database"]

[tool.importlinter]
root_package = "y3management"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Foundation dependency direction"
type = "layers"
containers = ["y3management"]
layers = ["main", "application", "cli", "operating", "http", "use_cases", "uow", "organization", "iam", "audit", "runtime", "ownership", "database", "config", "contracts"]
exhaustive = true

[[tool.importlinter.contracts]]
name = "Infrastructure does not depend on HTTP framework"
type = "forbidden"
source_modules = ["y3management.config", "y3management.database"]
forbidden_modules = ["fastapi", "starlette"]

[[tool.importlinter.contracts]]
name = "Use cases depend only on module public contracts"
type = "forbidden"
source_modules = ["y3management.use_cases", "y3management.http"]
forbidden_modules = ["y3management.iam.mfa", "y3management.iam.infrastructure", "y3management.iam.security", "y3management.iam.passwords", "y3management.organization.infrastructure", "y3management.audit.infrastructure"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Public contracts are independent of infrastructure and HTTP"
type = "forbidden"
source_modules = ["y3management.iam.public", "y3management.organization.public", "y3management.audit.public"]
forbidden_modules = ["sqlalchemy", "fastapi", "starlette", "psycopg"]

[[tool.importlinter.contracts]]
name = "IAM does not read other module internals"
type = "forbidden"
source_modules = ["y3management.iam"]
forbidden_modules = ["y3management.organization", "y3management.audit"]

[[tool.importlinter.contracts]]
name = "Organization depends only on IAM public facts"
type = "forbidden"
source_modules = ["y3management.organization"]
forbidden_modules = ["y3management.iam.mfa", "y3management.iam.infrastructure", "y3management.iam.security", "y3management.iam.passwords", "y3management.audit"]

[[tool.importlinter.contracts]]
name = "Audit does not read business modules"
type = "forbidden"
source_modules = ["y3management.audit"]
forbidden_modules = ["y3management.iam", "y3management.organization"]
